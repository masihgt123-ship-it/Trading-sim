name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool pkg-config \
            build-essential cmake ccache \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 libffi-dev libssl-dev \
            libbz2-dev libreadline-dev libsqlite3-dev \
            liblzma-dev libgdbm-dev libnss3-dev \
            libgl1-mesa-dev libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "buildozer>=1.5.1" \
            "Cython<3" \
            "setuptools<70"

      - name: Check project files
        run: |
          test -f main.py || { echo "Missing main.py"; exit 1; }
          test -f buildozer.spec || { echo "Missing buildozer.spec"; exit 1; }

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dogrunner-apk
          path: bin/*.apk
          if-no-files-found: error
          
